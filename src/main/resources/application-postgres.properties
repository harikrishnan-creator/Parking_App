# Postgres profile for local development
spring.datasource.url=jdbc:postgresql://localhost:5432/parkingdb
spring.datasource.username=parking_user
spring.datasource.password=parking_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Use Flyway migrations (recommended) and disable Hibernate auto DDL for predictable schema
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# Logging (optional)
logging.level.org.springframework=INFO
